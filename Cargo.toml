[workspace]
members = ["neuralib-python-ffi"]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://git.jacoblightning3.xyz/jacoblightning3/neuralib"


[package]
name = "neuralib"
description = "A simple Neural Network Library in Rust"
resolver = "3"
exclude = [
    "TODO.md",
    ".github",
    ".gitignore"
]

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true


[dependencies]
idx-lib = { version = "0.0.2", optional = true }
rand = "0.9.2"
rand_distr = { version = "0.5.1", default-features = false, features = ["std"] }
rmp-serde = { version = "1.3.0", optional = true }
serde = { version = "1.0.228", optional = true, features = ["derive"] }

[features]
default = ["serde"]
idx = ["dep:idx-lib"]
serde = ["dep:serde", "dep:rmp-serde"]

# SPEED
[profile.release]
codegen-units = 1
lto = "thin"
